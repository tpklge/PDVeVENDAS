name: Infraestrutura MariaDB e API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  infrastructure:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Subir stack com MariaDB real
        run: |
          cp docker/.env.example docker/.env
          docker network create meshcentral_proxy
          bash docker/scripts/install.sh
      - name: CRUD de produtos no MariaDB real
        run: |
          bash docker/scripts/initialize.sh
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/docker/secrets/api_admin_password:/run/test/admin_password:ro" \
            -v "$PWD/tools/test_products_mariadb.py:/run/test/products.py:ro" \
            api python /run/test/products.py
      - name: Clientes e fornecedores no MariaDB real
        run: |
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/tools/test_contacts_mariadb.py:/run/test/contacts.py:ro" \
            api python /run/test/contacts.py
      - name: Vendas e concorrência no MariaDB real
        run: |
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/tools/test_sales_mariadb.py:/run/test/sales.py:ro" \
            api python /run/test/sales.py
      - name: Estoque e concorrência com vendas no MariaDB real
        run: |
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/tools/test_inventory_mariadb.py:/run/test/inventory.py:ro" \
            api python /run/test/inventory.py
      - name: Caixa e financeiro concorrentes no MariaDB real
        run: |
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/tools/test_finance_mariadb.py:/run/test/finance.py:ro" \
            api python /run/test/finance.py
      - name: Relatórios e conciliação decimal no MariaDB real
        run: |
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/tools/test_reports_mariadb.py:/run/test/reports.py:ro" \
            api python /run/test/reports.py
      - name: Sincronização incremental e recuperação no MariaDB real
        run: |
          docker compose --env-file docker/.env -f docker/compose.yaml run --rm -T --no-deps \
            -e CI=true \
            -v "$PWD/tools/test_offline_mariadb.py:/run/test/offline.py:ro" \
            api python /run/test/offline.py
      - name: Testar persistência e backup restaurado
        env:
          SKIP_PUBLIC_HTTPS: "1"
        run: bash docker/scripts/validate-release.sh
      - name: Testes da API
        run: |
          python3 -m venv /tmp/tab5-api-tests
          /tmp/tab5-api-tests/bin/pip install -r api/requirements-test.in
          /tmp/tab5-api-tests/bin/python -m pytest api/tests -q
      - name: Diagnóstico em falha
        if: failure()
        run: docker compose --env-file docker/.env -f docker/compose.yaml logs --tail=100
      - name: Encerrar containers de CI
        if: always()
        run: docker compose --env-file docker/.env -f docker/compose.yaml down
