name: tab5-erp
x-api: &api
  build:
    context: ..
    dockerfile: docker/api.Dockerfile
  image: tab5-erp-api:0.1.0
  restart: unless-stopped
  networks: [backend]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: ${API_MEMORY_LIMIT:-512m}
  cpus: ${API_CPU_LIMIT:-1.0}
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  mariadb:
    image: mariadb:11.8.8@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tab5_erp
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      TZ: UTC
    secrets: [db_root_password, db_app_password, db_migration_password]
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    cpus: ${DB_CPU_LIMIT:-1.0}
    logging: *logs
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  migrate:
    <<: *api
    restart: "no"
    environment:
      DB_USER: tab5_migrator
      DB_PASSWORD_FILE: /run/secrets/db_migration_password
    secrets: [db_migration_password]
    command: [sh, -ec, "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      mariadb: {condition: service_healthy}
  api:
    <<: *api
    environment:
      DB_USER: tab5_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_app_password]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend, proxy]
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configure API_DOMAIN em .env}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL em .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy, edge]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    logging: *logs
networks:
  backend: {internal: true}
  proxy: {internal: true}
  edge: {}
volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  db_root_password: {file: ./secrets/db_root_password}
  db_app_password: {file: ./secrets/db_app_password}
  db_migration_password: {file: ./secrets/db_migration_password}
